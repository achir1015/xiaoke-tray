name: 建置安裝檔（Windows / macOS）

# 改 package.json 的版本號推到 main，就會建置並發佈對應的 Release
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/build.yml', '.github/release-notes.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc
      - run: npx vitest run tests/tray.test.ts

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable --x64
            name: win-x64
          # Apple 晶片與 Intel Mac 分開建置
          - os: macos-latest
            args: --mac dmg --arm64
            name: mac-arm64
          - os: macos-latest
            args: --mac dmg --x64
            name: mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx vite build
      - name: electron-builder
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: 建立 Release（版本號取自 package.json，同版本已存在則更新附件）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          ls -la out
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target main --title "小柯機器人3D托盤生成器 $TAG" --notes-file .github/release-notes.md
          fi
